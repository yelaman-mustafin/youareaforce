<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Созвездие Скорпиона</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --night: #020F11;
    --night-2: #072528;
    --tiffany: #0ABAB5;
    --tiffany-soft: #81D8D0;
    --mist: #CFEFEC;
    --dim: #5F8E8B;
    --line: rgba(129, 216, 208, 0.22);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --night: #020F11; } }
  :root[data-theme="dark"] { --night: #020F11; }

  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    overflow: hidden;
    background: var(--night);
    color: var(--mist);
    font-family: "Onest", "Segoe UI", system-ui, -apple-system, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }

  canvas.layer { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; pointer-events: none; }
  #bg { z-index: 0; }
  #fx { z-index: 5; }

  main {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px 24px;
    text-align: center;
  }
  .head { opacity: 0; animation: fade 1.4s ease 3.6s forwards; transition: opacity .8s; }
  .title {
    font-family: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    font-weight: 500;
    font-size: 30px;
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 18px rgba(10,186,181,.45);
  }
  .hint { color: var(--dim); font-size: 15px; margin-top: 6px; }

  .stage { width: min(94vw, 62vh, 520px); aspect-ratio: 1; margin: 10px 0 6px; transition: opacity 1.8s ease, transform 2.4s cubic-bezier(.2,.7,.2,1), filter 1.8s; }
  .stage.dim { opacity: .28; transform: scale(1.08); filter: blur(1px); }
  .sky { width: 100%; height: 100%; display: block; overflow: visible; }

  /* Astrolabe rings */
  .ring { fill: none; stroke: var(--tiffany-soft); stroke-width: .18; opacity: .35; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 2.6s cubic-bezier(.6,0,.2,1) .6s forwards; }
  .ring.thin { stroke-width: .1; opacity: .22; animation-delay: 1s; }
  .ring.dash { stroke-dasharray: .4 1.2; stroke-dashoffset: 0; animation: fade 2s ease 1.4s both; opacity: 0; }
  .spin { transform-box: view-box; transform-origin: 50px 50px; animation: spin 240s linear infinite; }
  .spin-rev { transform-box: view-box; transform-origin: 50px 50px; animation: spin 400s linear infinite reverse; }
  .ticks line { stroke: var(--tiffany-soft); stroke-width: .12; opacity: .4; }
  .ticks line.major { stroke-width: .2; opacity: .7; }
  .ticks text, .labels text { fill: var(--dim); font-family: "Onest", sans-serif; font-size: 1.9px; }
  .ticks { opacity: 0; animation: fade 1.6s ease 1.8s forwards; }
  .cross line { stroke: var(--tiffany-soft); stroke-width: .08; opacity: .18; }
  .cross { opacity: 0; animation: fade 2s ease 1.6s forwards; }
  .labels { opacity: 0; animation: fade 1.4s ease 3.4s forwards; }
  .labels text { fill: rgba(129,216,208,.55); font-size: 2.1px; letter-spacing: .05px; }
  .labels text.big { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 3px; fill: rgba(129,216,208,.6); }

  /* Constellation */
  .clines line { stroke: var(--tiffany-soft); stroke-width: .45; stroke-linecap: round; filter: drop-shadow(0 0 1px var(--tiffany)) drop-shadow(0 0 2.5px var(--tiffany)); }
  .star { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .star.in { animation: pop .9s cubic-bezier(.2,1.6,.4,1) forwards; }
  .star-dot { fill: #fff; }
  .star.plain .star-dot { fill: rgba(220,245,243,.75); }
  .star.memory .star-dot { filter: drop-shadow(0 0 1.2px #fff) drop-shadow(0 0 3px var(--tiffany)) drop-shadow(0 0 6px var(--tiffany)); }
  .halo { fill: var(--tiffany); opacity: 0; transform-box: fill-box; transform-origin: center; }
  .star.memory.ready .halo { animation: breathe 2.6s ease-in-out infinite; }
  .star.memory.opened .halo { animation: none; opacity: 0; }
  .orbit { fill: none; stroke: var(--tiffany-soft); stroke-width: .15; stroke-dasharray: .6 .9; opacity: 0; transform-box: fill-box; transform-origin: center; }
  .star.memory.ready .orbit { opacity: .7; animation: spin 9s linear infinite; }
  .star.memory.opened .orbit { opacity: 0; animation: none; }
  .star.memory.opened .star-dot { filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px var(--tiffany)) drop-shadow(0 0 10px var(--tiffany)); }
  .star.memory { cursor: pointer; }
  .star .hit { fill: transparent; }
  .sky.flare .star-dot { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 5px var(--tiffany)) drop-shadow(0 0 12px var(--tiffany)) !important; }
  .sky.flare .clines line { stroke: #E6FFFD; }

  /* Progress */
  .progress { display: flex; gap: 10px; justify-content: center; opacity: 0; animation: fade 1.4s ease 4s forwards; transition: opacity .8s; }
  .progress i { width: 7px; height: 7px; transform: rotate(45deg); border: 1px solid rgba(129,216,208,.5); transition: background .4s, box-shadow .4s, border-color .4s; }
  .progress i.on { background: var(--tiffany-soft); border-color: #fff; box-shadow: 0 0 8px var(--tiffany), 0 0 16px var(--tiffany); }
  .gone { opacity: 0 !important; animation: none !important; }

  @keyframes fade { to { opacity: 1; } }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0); } 60% { opacity: 1; transform: scale(1.8); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes breathe { 0%,100% { opacity: .03; transform: scale(.7); } 50% { opacity: .22; transform: scale(1.3); } }

  /* Finale overlay */
  #finale {
    position: fixed; inset: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 22px calc(24px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; visibility: hidden;
  }
  #finale.on { visibility: visible; }
  .f-label { color: var(--tiffany-soft); font-size: 15px; opacity: 0; margin-bottom: 4px; }
  .force {
    font-family: "Cormorant Garamond", Georgia, serif;
    font-style: italic; font-weight: 600;
    font-size: clamp(46px, 14vw, 104px);
    line-height: 1.15; white-space: nowrap;
    color: #F2FFFE; opacity: 0;
    text-shadow: 0 0 6px #fff, 0 0 14px var(--tiffany-soft), 0 0 30px var(--tiffany), 0 0 60px var(--tiffany), 0 0 110px rgba(10,186,181,.65);
  }
  .force.show { animation: ignite 1.8s ease forwards, pulse 4s ease-in-out 1.8s infinite; }
  .f-message { max-width: 32ch; margin-top: 22px; color: var(--mist); opacity: 0; }
  .f-sign { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-size: 22px; color: var(--tiffany-soft); margin-top: 14px; opacity: 0; }
  .rise { animation: rise 1.1s ease forwards; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes ignite {
    0% { opacity: 0; filter: blur(8px); letter-spacing: .06em; }
    55% { opacity: 1; filter: blur(0); }
    100% { opacity: 1; letter-spacing: 0; }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; text-shadow: 0 0 6px #fff, 0 0 14px var(--tiffany-soft), 0 0 30px var(--tiffany), 0 0 60px var(--tiffany), 0 0 110px rgba(10,186,181,.65); }
    50% { opacity: 1; text-shadow: 0 0 9px #fff, 0 0 22px var(--tiffany-soft), 0 0 46px var(--tiffany), 0 0 95px var(--tiffany), 0 0 150px rgba(10,186,181,.75); }
  }

  /* Memory card */
  .veil { position: fixed; inset: 0; background: rgba(1,8,9,.55); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); z-index: 10; opacity: 0; pointer-events: none; transition: opacity .35s; }
  .veil.open { opacity: 1; pointer-events: auto; }
  .card {
    position: fixed; left: 50%; bottom: 0; z-index: 11;
    width: min(460px, 100%);
    transform: translate(-50%, 105%);
    background: linear-gradient(180deg, rgba(10,186,181,.10), rgba(10,186,181,0) 40%), var(--night-2);
    border: 1px solid var(--line); border-bottom: none;
    border-radius: 26px 26px 0 0;
    padding: 30px 24px calc(24px + env(safe-area-inset-bottom, 0px));
    box-shadow: 0 -12px 60px rgba(10,186,181,.28);
    text-align: left;
    transition: transform .5s cubic-bezier(.2,.9,.2,1);
  }
  .card::before { content: ""; position: absolute; top: 10px; left: 50%; width: 40px; height: 4px; margin-left: -20px; border-radius: 4px; background: rgba(129,216,208,.3); }
  .card.open { transform: translate(-50%, 0); }
  .card-emoji { font-size: 36px; line-height: 1; margin-bottom: 14px; filter: drop-shadow(0 0 10px rgba(10,186,181,.6)); }
  .card-photo { width: 100%; max-height: 46vh; object-fit: cover; object-position: center 30%; border-radius: 16px; margin-bottom: 16px; display: block; box-shadow: 0 0 30px rgba(10,186,181,.25); }
  .card-when { color: var(--dim); font-size: 14px; margin-bottom: 2px; }
  .card-star { color: var(--tiffany-soft); font-size: 14px; text-shadow: 0 0 10px rgba(10,186,181,.6); margin-bottom: 2px; }
  .card-title { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; font-size: 30px; line-height: 1.15; color: #fff; margin-bottom: 10px; }
  .card-text { color: var(--mist); margin-bottom: 24px; max-width: 40ch; }
  .primary {
    font: inherit; cursor: pointer; width: 100%;
    padding: 16px 20px; border: 1px solid var(--tiffany); border-radius: 999px;
    background: rgba(10,186,181,.14); color: #fff; font-weight: 600;
    box-shadow: 0 0 22px rgba(10,186,181,.35), inset 0 0 12px rgba(10,186,181,.2);
  }
  .primary:active { background: rgba(10,186,181,.28); }
  .hidden { display: none !important; }
  :focus-visible { outline: 2px solid var(--tiffany-soft); outline-offset: 3px; }
  .star:focus, .star:focus-visible, svg:focus { outline: none; }
  .star:focus-visible .orbit { opacity: 1; stroke: #fff; }

  /* Ilan */
  #finale { transition: opacity 1s ease; }
  #finale.out { opacity: 0; }
  .f-next { width: auto; margin-top: 34px; padding: 14px 28px; opacity: 0; pointer-events: none; }
  .f-next.rise { pointer-events: auto; }
  .stage.zoom { transform: scale(2.1); opacity: 1; filter: none; }
  .ilan { opacity: 0; transform-box: fill-box; transform-origin: center; cursor: pointer; pointer-events: none; }
  .ilan.in { animation: pop 1.3s cubic-bezier(.2,1.6,.4,1) forwards; pointer-events: auto; }
  .ilan .star-dot { fill: #fff; filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 4px var(--tiffany)) drop-shadow(0 0 10px var(--tiffany)) drop-shadow(0 0 18px var(--tiffany)); }
  .ilan .halo { animation: breathe 2.2s ease-in-out infinite; }
  .ilan .orbit { opacity: .8; animation: spin 7s linear infinite; }
  .ilan .orbit.two { animation: spin 11s linear infinite reverse; stroke-dasharray: .3 1.4; }
  .ilan .hit { fill: transparent; }
  .ilan-label { fill: #E6FFFD; font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: 3.2px; opacity: 0; transition: opacity 1.2s; filter: drop-shadow(0 0 1.5px var(--tiffany)); }
  .ilan-label.on { opacity: 1; }
  .ilan-note { color: var(--tiffany-soft); font-size: 15px; opacity: 0; transition: opacity 1.2s; text-shadow: 0 0 10px rgba(10,186,181,.6); }
  .ilan-note.on { opacity: 1; }
  .card { max-height: 90vh; max-height: 90dvh; overflow-y: auto; }
  .card-facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: -8px 0 22px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(10,186,181,.06); font-size: 14px; }
  .card-facts dt { color: var(--dim); }
  .card-facts dd { color: #fff; font-variant-numeric: tabular-nums; }
  .card-facts a { color: var(--tiffany-soft); }

  /* Подарок */
  .gift-btn { margin-top: 18px; }
  #gift { position: fixed; inset: 0; z-index: 6; pointer-events: none; visibility: hidden; }
  #gift.on { visibility: visible; }
  .gift-caption { position: absolute; left: 0; right: 0; top: 74%; text-align: center; padding: 0 20px; }
  .gift-title { font-family: "Cormorant Garamond", Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(42px, 12vw, 80px); line-height: 1.1; color: #F2FFFE; opacity: 0; text-shadow: 0 0 6px #fff, 0 0 14px var(--tiffany-soft), 0 0 30px var(--tiffany), 0 0 60px var(--tiffany); }
  .gift-sub { color: var(--tiffany-soft); margin-top: 6px; opacity: 0; }
  .gift-title.show { animation: ignite 1.8s ease forwards, pulse 4s ease-in-out 1.8s infinite; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<canvas class="layer" id="bg"></canvas>

<main>
  <div class="head" id="head">
    <h1 class="title">Созвездие Скорпиона</h1>
    <p class="hint">Семь звёзд хранят наши воспоминания. Найди их все</p>
  </div>
  <div class="stage" id="stage">
    <svg class="sky" id="sky" viewBox="-4 -4 108 108" role="group" aria-label="Созвездие Скорпиона"></svg>
  </div>
  <div class="progress" id="progress" aria-live="polite"></div>
  <p class="ilan-note" id="ilanNote">Ilan — твоя звезда</p>
  <button class="primary f-next gift-btn" id="giftBtn">И последнее ✦</button>
</main>

<canvas class="layer" id="fx"></canvas>

<div id="finale" aria-live="polite">
  <p class="f-label" id="fLabel">Звёзды сложились</p>
  <p class="force" id="force">You are a force</p>
  <p class="f-message" id="fMessage"></p>
  <p class="f-sign" id="fSign"></p>
  <button class="primary f-next" id="fNext">Это ещё не всё ✦</button>
</div>

<div id="gift" aria-live="polite">
  <div class="gift-caption">
    <p class="gift-title" id="giftTitle"></p>
    <p class="gift-sub" id="giftSub"></p>
  </div>
</div>

<div class="veil" id="veil"></div>
<div class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card-emoji" id="cardEmoji"></div>
  <img class="card-photo hidden" id="cardPhoto" alt="">
  <p class="card-star" id="cardStar"></p>
  <p class="card-when" id="cardWhen"></p>
  <h2 class="card-title" id="cardTitle"></h2>
  <p class="card-text" id="cardText"></p>
  <dl class="card-facts hidden" id="cardFacts"></dl>
  <button class="primary" id="cardClose">Дальше</button>
</div>

<script>
/* ============================================================
   ВСЁ, ЧТО НУЖНО ЗАПОЛНИТЬ, — ЗДЕСЬ
   Семь воспоминаний = семь мерцающих звёзд.
   photo: можно оставить пустым "" (тогда показывается эмодзи)

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const easeIO = (t) => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const sleep = (ms) => new Promise(r => setTimeout(r, reduced ? 0 : ms));

const svg = $("sky");
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
};

function buildSky() {
  // кольца астролябии
  const rot = el("g", { class: "spin" }, svg);
  el("circle", { class: "ring", cx: 50, cy: 50, r: 51, pathLength: 1 }, rot);

  const ticks = el("g", { class: "ticks" }, rot);
  for (let d = 0; d < 360; d += 5) {
    const a = d * Math.PI / 180, major = d % 30 === 0;
    const r1 = 48.4, r2 = major ? 51 : 49.6;
    el("line", { x1: 50 + Math.cos(a) * r1, y1: 50 + Math.sin(a) * r1, x2: 50 + Math.cos(a) * r2, y2: 50 + Math.sin(a) * r2, class: major ? "major" : "" }, ticks);
    if (major) {
      const t = el("text", { x: 50 + Math.cos(a) * 53, y: 50 + Math.sin(a) * 53 + .7, "text-anchor": "middle" }, ticks);
      t.textContent = d + "°";
    }
  }
  const rev = el("g", { class: "spin-rev" }, svg);
  el("circle", { class: "ring dash", cx: 50, cy: 50, r: 42, pathLength: 100 }, rev);
  el("circle", { class: "ring thin", cx: 50, cy: 50, r: 30, pathLength: 1, style: "animation-delay:1.3s;opacity:.12" }, rev);
  const cross = el("g", { class: "cross" }, svg);
  el("line", { x1: 50, y1: 1, x2: 50, y2: 99 }, cross);
  el("line", { x1: 1, y1: 50, x2: 99, y2: 50 }, cross);
  el("line", { x1: 15, y1: 15, x2: 85, y2: 85, style: "opacity:.09" }, cross);
  el("line", { x1: 85, y1: 15, x2: 15, y2: 85, style: "opacity:.09" }, cross);

  // имена звёзд
  const labels = el("g", { class: "labels" }, svg);

function toScreen(x, y) {
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  const p = pt.matrixTransform(svg.getScreenCTM());
  return { x: p.x, y: p.y };
}

/* ---------- Холсты ---------- */
const bg = $("bg"), bctx = bg.getContext("2d");
const fx = $("fx"), fctx = fx.getContext("2d");
let W = 0, H = 0, DPR = 1;
let bgStars = [], dust = [], nebula = null;
const introStart = performance.now();
let par = { x: 0, y: 0, tx: 0, ty: 0 };

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  [bg, fx].forEach(c => { c.width = W * DPR; c.height = H * DPR; });
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  fctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
  makeNebula();
}

function makeStars() {
  const n = Math.round(W * H / 1300);
  const cx = W / 2, cy = H / 2, maxD = Math.hypot(cx, cy);
  bgStars = [];
  for (let i = 0; i < n; i++) {
    const z = Math.pow(Math.random(), 2.2);
    const x = Math.random() * W, y = Math.random() * H;
    bgStars.push({
      x, y, z,
      r: .25 + z * 1.1 + (Math.random() < .025 ? .9 : 0),
      ph: Math.random() * 6.28, sp: rand(.4, 2.2),
      tint: Math.random() < .22,
      delay: Math.hypot(x - cx, y - cy) / maxD * 1800 + rand(0, 400)
    });
  }
  dust = [];
  for (let i = 0; i < 40; i++) dust.push({ x: Math.random() * W, y: Math.random() * H, vx: rand(-.006, .006), vy: rand(-.012, -.003), r: rand(.6, 1.8), ph: Math.random() * 6.28 });
}

function makeNebula() {
  nebula = document.createElement("canvas");
  nebula.width = Math.ceil(W * DPR / 2); nebula.height = Math.ceil(H * DPR / 2);
  const c = nebula.getContext("2d");
  c.scale(DPR / 2, DPR / 2);
  c.globalCompositeOperation = "lighter";
  const blobs = 70;
  for (let i = 0; i < blobs; i++) {
    const t = i / blobs;
    const x = -W * .1 + t * W * 1.2 + rand(-60, 60);
    const y = H * .95 - t * H * .9 + Math.sin(t * 7) * 40 + rand(-70, 70);
    const r = rand(60, 190) * (W < 600 ? .8 : 1);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    const pick = Math.random();
    const col = pick < .5 ? "10,186,181" : pick < .8 ? "129,216,208" : "60,90,170";
    const a = pick < .8 ? rand(.03, .07) : rand(.025, .05);
    g.addColorStop(0, `rgba(${col},${a})`);
    g.addColorStop(1, `rgba(${col},0)`);
    c.fillStyle = g;
    c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
  }
  // мелкая звёздная пыль внутри туманности
  for (let i = 0; i < 500; i++) {
    const t = Math.random();
    const x = -W * .1 + t * W * 1.2 + rand(-90, 90);
    const y = H * .95 - t * H * .9 + Math.sin(t * 7) * 40 + rand(-90, 90);
    c.fillStyle = `rgba(220,250,248,${rand(.05, .35)})`;
    c.fillRect(x, y, rand(.4, 1.2), rand(.4, 1.2));
  }
  // тёмные прожилки
  c.globalCompositeOperation = "destination-out";
  for (let i = 0; i < 18; i++) {
    const t = Math.random();
    const x = -W * .1 + t * W * 1.2 + rand(-20, 20);
    const y = H * .95 - t * H * .9 + Math.sin(t * 7) * 40 + rand(-20, 20);
    const r = rand(20, 50);
    const g = c.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, "rgba(0,0,0,.5)"); g.addColorStop(1, "rgba(0,0,0,0)");
    c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
  }
}

/* ---------- Эффекты ---------- */
let meteors = [], nextMeteor = performance.now() + 2500, showerUntil = 0;
let parts = [], rings = [], sparks = [], textParts = [], textFadeStart = 0, pendParts = [];

function spawnMeteor(now) {
  const fromLeft = Math.random() < .5;
  const ang = (fromLeft ? rand(20, 40) : rand(140, 160)) * Math.PI / 180;
  const sp = rand(.7, 1.3);
  meteors.push({ x: rand(W * .1, W * .9), y: rand(-20, H * .4), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, born: now, life: rand(700, 1200), len: rand(80, 170) });
}

function burst(x, y, n = 46, power = 1) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, s = rand(.03, .22) * power;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, born: performance.now(), life: rand(700, 1500), r: rand(.6, 1.8), white: Math.random() < .4 });
  }
  rings.push({ x, y, born: performance.now(), life: 900, max: 46 * power, w: 1.5 });
}

function frame(now) {
  const t = now - introStart;
  par.x += (par.tx - par.x) * .04;
  par.y += (par.ty - par.y) * .04;

  /* фон */
  bctx.clearRect(0, 0, W, H);
  const g = bctx.createRadialGradient(W / 2, H * 1.1, 0, W / 2, H * 1.1, Math.max(W, H));
  g.addColorStop(0, "rgba(10,186,181,.10)"); g.addColorStop(1, "rgba(10,186,181,0)");
  bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
  if (nebula) {
    bctx.globalAlpha = clamp(t / 3500) * .95;
    bctx.drawImage(nebula, par.x * 8 - 10, par.y * 8 - 10, W + 20, H + 20);
    bctx.globalAlpha = 1;
  }
  for (const s of bgStars) {
    const intro = reduced ? 1 : clamp((t - s.delay) / 900);
    if (intro <= 0) continue;
    const tw = .55 + .45 * Math.sin(now * .001 * s.sp + s.ph);
    const a = intro * tw * (.35 + s.z * .65);
    const x = s.x + par.x * s.z * 14, y = s.y + par.y * s.z * 14;
    const col = s.tint ? "160,235,230" : "235,250,250";
    if (s.r > 1.1) {
      bctx.fillStyle = `rgba(10,186,181,${a * .18})`;
      bctx.beginPath(); bctx.arc(x, y, s.r * 4, 0, 6.283); bctx.fill();
    }
    bctx.fillStyle = `rgba(${col},${a})`;
    bctx.beginPath(); bctx.arc(x, y, s.r, 0, 6.283); bctx.fill();
  }
  for (const d of dust) {
    d.x += d.vx * 16; d.y += d.vy * 16;
    if (d.y < -10) { d.y = H + 10; d.x = Math.random() * W; }
    if (d.x < -10) d.x = W + 10; if (d.x > W + 10) d.x = -10;
    const a = (.15 + .15 * Math.sin(now * .0008 + d.ph)) * clamp(t / 4000);
    bctx.fillStyle = `rgba(129,216,208,${a})`;
    bctx.beginPath(); bctx.arc(d.x + par.x * 20, d.y + par.y * 20, d.r, 0, 6.283); bctx.fill();
  }
  // метеоры
  if (!reduced && t > 2500 && now > nextMeteor) {
    spawnMeteor(now);
    nextMeteor = now + (now < showerUntil ? rand(120, 320) : rand(3500, 8000));
  }
  meteors = meteors.filter(m => now - m.born < m.life);
  for (const m of meteors) {
    const p = (now - m.born) / m.life;
    const dt = now - m.born;
    const x = m.x + m.vx * dt, y = m.y + m.vy * dt;
    const sp = Math.hypot(m.vx, m.vy);
    const tx = x - m.vx / sp * m.len, ty = y - m.vy / sp * m.len;
    const a = Math.sin(p * Math.PI);
    const lg = bctx.createLinearGradient(x, y, tx, ty);
    lg.addColorStop(0, `rgba(240,255,254,${a})`);
    lg.addColorStop(.25, `rgba(129,216,208,${a * .6})`);
    lg.addColorStop(1, "rgba(10,186,181,0)");
    bctx.strokeStyle = lg; bctx.lineWidth = 1.4; bctx.lineCap = "round";
    bctx.beginPath(); bctx.moveTo(x, y); bctx.lineTo(tx, ty); bctx.stroke();
    bctx.fillStyle = `rgba(255,255,255,${a})`;
    bctx.beginPath(); bctx.arc(x, y, 1.3, 0, 6.283); bctx.fill();
  }

  /* передний план: шлейфы */
  fctx.globalCompositeOperation = "destination-out";
  fctx.fillStyle = "rgba(0,0,0,.24)";
  fctx.fillRect(0, 0, W, H);
  fctx.globalCompositeOperation = "lighter";

  rings = rings.filter(r => now - r.born < r.life);
  for (const r of rings) {
    if (now < r.born) continue;
    const p = easeOut(clamp((now - r.born) / r.life));
    fctx.strokeStyle = `rgba(129,216,208,${(1 - p) * .8})`;
    fctx.lineWidth = r.w * (1 - p) + .3;
    fctx.beginPath(); fctx.arc(r.x, r.y, 4 + r.max * p, 0, 6.283); fctx.stroke();
  }
  parts = parts.filter(p => now - p.born < p.life);
  for (const p of parts) {
    const dt = 16;
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .965; p.vy *= .965;
    const a = 1 - (now - p.born) / p.life;
    fctx.fillStyle = p.white ? `rgba(255,255,255,${a})` : `rgba(129,216,208,${a})`;
    fctx.beginPath(); fctx.arc(p.x, p.y, p.r, 0, 6.283); fctx.fill();
  }
  sparks = sparks.filter(s => {
    const p = (now - s.start) / s.dur;
    if (p < 0) return true;
    if (p > 1) { burst(s.bx, s.by, 14, .45); return false; }
    const x = s.ax + (s.bx - s.ax) * p, y = s.ay + (s.by - s.ay) * p;
    const gr = fctx.createRadialGradient(x, y, 0, x, y, 12);
    gr.addColorStop(0, "rgba(255,255,255,1)"); gr.addColorStop(.3, "rgba(129,216,208,.6)"); gr.addColorStop(1, "rgba(10,186,181,0)");
    fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(x, y, 12, 0, 6.283); fctx.fill();
    parts.push({ x, y, vx: rand(-.03, .03), vy: rand(-.03, .03), born: now, life: rand(300, 700), r: rand(.5, 1.2), white: true });
    return true;
  });

  if (textParts.length) {
    const fade = textFadeStart ? 1 - clamp((now - textFadeStart) / 1600) : 1;
    for (const p of textParts) {
      const k = clamp((now - p.start) / p.dur);
      if (k <= 0) continue;
      const e = easeIO(k);
      const u = 1 - e;
      const x = u * u * p.sx + 2 * u * e * p.cx + e * e * p.ex;
      const y = u * u * p.sy + 2 * u * e * p.cy + e * e * p.ey;
      const tw = k >= 1 ? .6 + .4 * Math.sin(now * .006 + p.ph) : 1;
      const a = fade * tw;
      if (a <= .01) continue;
      fctx.fillStyle = p.white ? `rgba(255,255,255,${a})` : `rgba(129,216,208,${a})`;
      fctx.beginPath(); fctx.arc(x, y, p.r * (k < 1 ? 1.3 : 1), 0, 6.283); fctx.fill();
    }
    if (textFadeStart && now - textFadeStart > 1700) textParts = [];
  }

  if (pendParts.length) {
    const bw = Math.min(W * .84, H * .56 * PENDANT_ASPECT), bh = bw / PENDANT_ASPECT;
    const bx = W / 2 - bw / 2, by = H * .40 - bh / 2;
    for (const p of pendParts) {
      const k = clamp((now - p.start) / p.dur);
      if (k <= 0) continue;
      const ex = bx + p.u * bw, ey = by + p.v * bh;
      let x, y;
      if (k < 1) {
        const e = easeIO(k), u = 1 - e;
        const cx = (p.sx + ex) / 2 + p.ox, cy = (p.sy + ey) / 2 + p.oy;
        x = u * u * p.sx + 2 * u * e * cx + e * e * ex;
        y = u * u * p.sy + 2 * u * e * cy + e * e * ey;
      } else { x = ex; y = ey; }
      const tw = k >= 1 ? .45 + .55 * Math.sin(now * .003 * p.sp + p.ph) : 1;
      if (k >= 1 && p.big) {
        const gr = fctx.createRadialGradient(x, y, 0, x, y, 7);
        gr.addColorStop(0, `rgba(129,216,208,${.35 * tw})`); gr.addColorStop(1, "rgba(10,186,181,0)");
        fctx.fillStyle = gr; fctx.beginPath(); fctx.arc(x, y, 7, 0, 6.283); fctx.fill();
      }
      fctx.fillStyle = p.white ? `rgba(255,255,255,${tw})` : `rgba(129,216,208,${tw})`;
      fctx.beginPath(); fctx.arc(x, y, p.r, 0, 6.283); fctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

/* ---------- Появление ---------- */
async function intro() {
  await sleep(2000);
  const order = STARS.map((s, i) => i);
  for (const i of order) {
    STARS[i].g.classList.add("in");
    if (!reduced && STARS[i].m !== undefined) {
      const p = toScreen(STARS[i].x, STARS[i].y);
      setTimeout(() => burst(p.x, p.y, 10, .35), 300);
    }
    await sleep(110);
  }
  await sleep(800);
  STARS.forEach(s => s.m !== undefined && s.g.classList.add("ready"));
}

/* ---------- Воспоминания ---------- */
const opened = new Set();
let lastStar = null;

function openMemory(s) {
  if (document.body.dataset.finished) return;
  const m = MEMORIES[s.m];
  lastStar = s.g;
  const p = toScreen(s.x, s.y);
  burst(p.x, p.y, 50, 1);
  $("cardEmoji").textContent = m.emoji;
  const img = $("cardPhoto");
  if (m.photo) { img.src = m.photo; img.classList.remove("hidden"); $("cardEmoji").classList.add("hidden"); }
  else { img.classList.add("hidden"); $("cardEmoji").classList.remove("hidden"); }
  $("cardStar").textContent = m.star || "";
  $("cardWhen").textContent = m.when;
  $("cardTitle").textContent = m.title;
  $("cardText").textContent = m.text;
  $("cardFacts").classList.add("hidden");
  cardMode = "memory";
  const isLast = !opened.has(s.m) && opened.size === MEMORIES.length - 1;
  $("cardClose").textContent = isLast ? "Собрать созвездие" : "Дальше";
  opened.add(s.m);
  s.g.classList.add("opened");
  [...$("progress").children].forEach((d, i) => d.classList.toggle("on", i < opened.size));
  setTimeout(() => { $("veil").classList.add("open"); $("card").classList.add("open"); }, 260);
  setTimeout(() => $("cardClose").focus(), 700);
}

function closeMemory() {
  $("veil").classList.remove("open");
  $("card").classList.remove("open");
  if (cardMode === "ilan") { afterIlan(); return; }
  if (cardMode === "gift") return;
  if (lastStar) lastStar.focus({ preventScroll: true });
  if (opened.size === MEMORIES.length && !document.body.dataset.finished) {
    document.body.dataset.finished = "1";
    setTimeout(finale, 600);
  }
}

/* ---------- Финал ---------- */
async function textTargets(node) {
  try { await document.fonts.load('italic 600 90px "Cormorant Garamond"'); } catch (e) {}
  const r = node.getBoundingClientRect();
  const cs = getComputedStyle(node);
  const off = document.createElement("canvas");
  off.width = Math.ceil(r.width); off.height = Math.ceil(r.height);
  const c = off.getContext("2d");
  c.font = `${cs.fontStyle} ${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  c.textAlign = "center"; c.textBaseline = "middle"; c.fillStyle = "#fff";
  c.fillText(node.textContent, r.width / 2, r.height / 2 + parseFloat(cs.fontSize) * .04);
  const data = c.getImageData(0, 0, off.width, off.height).data;
  const step = Math.max(2, Math.round(r.width / 210));
  const pts = [];
  for (let y = 0; y < off.height; y += step)
    for (let x = 0; x < off.width; x += step)
      if (data[(y * off.width + x) * 4 + 3] > 140) pts.push({ x: r.left + x + rand(-.5, .5), y: r.top + y + rand(-.5, .5) });
  return pts;
}

async function finale() {
  $("head").classList.add("gone");
  $("progress").classList.add("gone");
  STARS.forEach(s => s.g.classList.remove("ready"));
  const layer = $("clines");

  // 1. линии рисуются, по ним бегут искры
  const step = 260;
  LINES.forEach(([a, b], i) => {
    const A = STARS[a], B = STARS[b];
    const l = el("line", { x1: A.x, y1: A.y, x2: B.x, y2: B.y }, layer);
    const len = Math.hypot(B.x - A.x, B.y - A.y);
    l.style.strokeDasharray = len;
    l.style.strokeDashoffset = len;
    l.style.transition = `stroke-dashoffset ${step}ms linear ${i * step}ms`;
    const pa = toScreen(A.x, A.y), pb = toScreen(B.x, B.y);
    sparks.push({ ax: pa.x, ay: pa.y, bx: pb.x, by: pb.y, start: performance.now() + i * step, dur: step });
  });
  requestAnimationFrame(() => requestAnimationFrame(() => layer.querySelectorAll("line").forEach(l => l.style.strokeDashoffset = 0)));
  await sleep(LINES.length * step + 300);

  // 2. вспышка, ударная волна, звездопад
  svg.classList.add("flare");
  const ant = toScreen(STARS[ANTARES].x, STARS[ANTARES].y);
  const now = performance.now();
  rings.push({ x: ant.x, y: ant.y, born: now, life: 1600, max: Math.max(W, H) * .7, w: 3 });
  rings.push({ x: ant.x, y: ant.y, born: now + 180, life: 1800, max: Math.max(W, H) * .9, w: 2 });
  rings.push({ x: ant.x, y: ant.y, born: now + 380, life: 2000, max: Math.max(W, H) * 1.1, w: 1.2 });
  burst(ant.x, ant.y, 140, 2.2);
  STARS.forEach(s => { const p = toScreen(s.x, s.y); burst(p.x, p.y, 18, .7); });
  showerUntil = now + 6000; nextMeteor = now + 300;
  const origins = STARS.map(s => toScreen(s.x, s.y));
  await sleep(1300);

  // 3. звёзды разлетаются и собираются в текст
  $("stage").classList.add("dim");
  $("finale").classList.add("on");
  const force = $("force");
  const targets = reduced ? [] : await textTargets(force);
  const t0 = performance.now();
  const midX = W / 2, midY = H / 2;
  textParts = targets.map(tg => {
    const o = origins[Math.floor(Math.random() * origins.length)];
    const sx = o.x + rand(-6, 6), sy = o.y + rand(-6, 6);
    const ang = Math.random() * 6.283, swirl = rand(80, 260);
    return {
      sx, sy, ex: tg.x, ey: tg.y,
      cx: (sx + tg.x) / 2 + Math.cos(ang) * swirl + (midX - sx) * .2,
      cy: (sy + tg.y) / 2 + Math.sin(ang) * swirl,
      start: t0 + rand(0, 600) + (tg.x / W) * 600,
      dur: rand(1900, 2700), r: rand(.7, 1.5), white: Math.random() < .55, ph: Math.random() * 6.28
    };
  });
  const lastArrive = textParts.reduce((m, p) => Math.max(m, p.start + p.dur), t0);
  await sleep(Math.max(0, lastArrive - performance.now() - 300));

  // 4. надпись загорается
  force.classList.add("show");
  const fr = force.getBoundingClientRect();
  burst(fr.left + fr.width / 2, fr.top + fr.height / 2, 90, 1.8);
  rings.push({ x: fr.left + fr.width / 2, y: fr.top + fr.height / 2, born: performance.now(), life: 1400, max: Math.max(W, H) * .6, w: 2 });
  textFadeStart = performance.now() + 700;
  await sleep(1400);
  $("fLabel").classList.add("rise");
  $("fMessage").textContent = FINAL_MESSAGE;
  $("fSign").textContent = SIGNATURE;
  await sleep(900);
  $("fMessage").classList.add("rise");
  await sleep(1300);
  $("fSign").classList.add("rise");
  await sleep(1800);
  $("fNext").classList.add("rise");
}

/* ---------- Звезда Ilan ---------- */
function centerOf(node) { const r = node.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

async function revealIlan() {
  $("fNext").classList.remove("rise");
  $("finale").classList.add("out");
  textFadeStart = textFadeStart || performance.now();
  await sleep(900);
  $("finale").classList.remove("on");
  const st = $("stage");
  st.style.transformOrigin = `${(ILAN.x + 4) / 112 * 100}% ${(ILAN.y + 4) / 112 * 100}%`;
  st.classList.remove("dim");
  st.classList.add("zoom");
  await sleep(2500);
  const ig = $("ilan");
  ig.classList.add("in");
  await sleep(250);
  const c = centerOf($("ilanDot"));
  const now = performance.now();
  burst(c.x, c.y, 130, 1.7);
  rings.push({ x: c.x, y: c.y, born: now, life: 1500, max: Math.max(W, H) * .6, w: 2.5 });
  rings.push({ x: c.x, y: c.y, born: now + 220, life: 1800, max: Math.max(W, H) * .8, w: 1.4 });
  showerUntil = now + 3000; nextMeteor = now + 200;
  await sleep(900);
  $("ilanLabel").classList.add("on");
  await sleep(1300);
  openIlan();
}

function openIlan() {
  cardMode = "ilan";
  lastStar = $("ilan");
  $("cardEmoji").textContent = "🌟";
  $("cardEmoji").classList.remove("hidden");
  $("cardPhoto").classList.add("hidden");
  $("cardStar").textContent = "Звезда Ilan — рядом с сердцем Скорпиона";
  $("cardWhen").textContent = "Названа 7 ноября 2026";
  $("cardTitle").textContent = "Ilan";
  $("cardText").textContent = "Это твоя звезда. Она в созвездии Скорпиона, всего в 2,3° от Антареса. Глазом её не увидеть, только в телескоп. Но теперь ты знаешь, где она.";
  $("cardFacts").innerHTML = `
    <dt>Прямое восхождение</dt><dd>16ч 38м 42,861с</dd>
    <dt>Склонение</dt><dd>−25° 31′ 13,73″</dd>
    <dt>Звёздная величина</dt><dd>11,45</dd>
    <dt>Код OSR</dt><dd>ZLY724696</dd>
    <dt>Страница</dt><dd><a href="https://stars.osr.org/ZLY724696" target="_blank" rel="noopener">stars.osr.org</a></dd>`;
  $("cardFacts").classList.remove("hidden");
  $("cardClose").textContent = "Закрыть";
  $("veil").classList.add("open");
  $("card").classList.add("open");
  setTimeout(() => $("cardClose").focus(), 450);
}

function afterIlan() {
  $("stage").classList.remove("zoom");
  $("ilanNote").classList.add("on");
  if (!document.body.dataset.gift) setTimeout(() => $("giftBtn").classList.add("rise"), 2600);
}

async function revealGift() {
  document.body.dataset.gift = "1";
  $("giftBtn").classList.remove("rise");
  $("giftBtn").classList.add("gone");
  $("ilanNote").classList.remove("on");
  const origins = STARS.map(s => toScreen(s.x, s.y));
  origins.push(centerOf($("ilanDot")));
  $("stage").classList.add("dim");
  STARS.forEach(s => { const p = toScreen(s.x, s.y); burst(p.x, p.y, 12, .5); });
  await sleep(500);
  const t0 = performance.now();
  pendParts = [];
  for (let i = 0; i < PENDANT_PTS.length; i += 2) {
    const o = origins[Math.floor(Math.random() * origins.length)];
    const a = Math.random() * 6.283, sw = rand(60, 220);
    pendParts.push({
      u: PENDANT_PTS[i], v: PENDANT_PTS[i + 1],
      sx: o.x + rand(-5, 5), sy: o.y + rand(-5, 5), ox: Math.cos(a) * sw, oy: Math.sin(a) * sw,
      start: t0 + PENDANT_PTS[i + 1] * 900 + rand(0, 500), dur: rand(1800, 2600),
      r: rand(.7, 1.5), white: Math.random() < .55, ph: Math.random() * 6.28, sp: rand(.5, 1.6), big: Math.random() < .08
    });
  }
  await sleep(3600);
  const bw = Math.min(W * .84, H * .56 * PENDANT_ASPECT), bh = bw / PENDANT_ASPECT;
  const now = performance.now();
  rings.push({ x: W / 2, y: H * .40 + bh * .3, born: now, life: 1600, max: Math.max(W, H) * .7, w: 2.5 });
  burst(W / 2, H * .40 + bh * .3, 90, 1.5);
  $("gift").classList.add("on");
  $("giftTitle").textContent = GIFT.caption;
  $("giftSub").textContent = GIFT.sub;
  $("giftTitle").classList.add("show");
  await sleep(1300);
  $("giftSub").classList.add("rise");
  await sleep(2400);
  openGift();
}

function openGift() {
  cardMode = "gift";
  lastStar = null;
  $("cardEmoji").classList.add("hidden");
  const img = $("cardPhoto");
  img.src = PHOTO_PENDANT; img.classList.remove("hidden");
  $("cardStar").textContent = GIFT.star;
  $("cardWhen").textContent = GIFT.when;
  $("cardTitle").textContent = GIFT.title;
  $("cardText").textContent = GIFT.text;
  $("cardFacts").classList.add("hidden");
  $("cardClose").textContent = "Закрыть";
  $("veil").classList.add("open");
  $("card").classList.add("open");
  setTimeout(() => $("cardClose").focus(), 450);
}

/* ---------- Старт ---------- */
buildSky();
resize();
addEventListener("resize", resize);
addEventListener("pointermove", e => { par.tx = (e.clientX / W - .5) * 2; par.ty = (e.clientY / H - .5) * 2; });
$("cardClose").addEventListener("click", closeMemory);
$("fNext").addEventListener("click", revealIlan);
$("giftBtn").addEventListener("click", revealGift);
$("veil").addEventListener("click", closeMemory);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("card").classList.contains("open")) closeMemory(); });
requestAnimationFrame(frame);
intro();
</script>
